schema: cream/v1
name: lock-restart
version: 1.0.0
summary: фикстура lock-restart
cream: ">=1.0.0"
platform: {family: deb, arch: [amd64, arm64]}
# Правило §7.3 соблюдено: render из ExecStartPre — lock: none, поэтому
# set-managed (lock: exclusive + синхронный restart) завершается за время restart.
hooks:
  install: {}
  remove: {}
actions:
  render: {summary: "рендер перед стартом юнита", lock: none, phases: [build, live]}
  set-managed: {summary: "пишет метки и синхронно перезапускает юнит", args: free, lock: exclusive, output: json, timeout: 3m}
files:
  - {src: files/lock-restart.service, dst: /etc/systemd/system/lock-restart.service, mode: "0644"}
