schema: cream/v1
name: every-boot-cream-too-low
version: 1.0.0
summary: every_boot при cream ниже 1.2.0
cream: ">=1.0.0"
platform: {family: deb, arch: [amd64, arm64]}
# Дефект манифеста: hooks.configure.every_boot появился в cream 1.2.0, а cream:
# его не требует (ADR-0004) — 65 manifest.invalid.
hooks:
  install: {}
  configure: {stage: system, every_boot: true}
