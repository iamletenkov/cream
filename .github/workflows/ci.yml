name: CI

# Проверки — те же make-цели, что запускают руками (make lint / test /
# build-all = make ci, vuln, repro-check, test-integration): Go и остальные
# инструменты — в контейнерах с закреплёнными образами (Makefile). CI и
# локальный прогон не расходятся.
#
# Выпуск — release-please: на main после зелёных проверок он ведёт PR
# «release X.Y.Z» (CHANGELOG.md); слияние этого PR создаёт тег vX.Y.Z и
# опубликованный релиз. Теги руками не ставят. Job release-assets собирает на
# теге make dist-release (SOURCE_DATE_EPOCH = время коммита тега) и прикладывает
# к релизу .deb amd64/arm64, тарболы и SHA256SUMS (спека §15).
#
# Ручной запуск (workflow_dispatch): без tag — те же проверки на выбранной
# ветке; с tag — ещё и сборка ассетов этого тега (сухой прогон), а с
# upload=true — загрузка их в существующий релиз (--clobber).

# Ветки проверяются на pull_request, push — только main: там релиз.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег vX.Y.Z: собрать ассеты релиза (пусто — только проверки)"
        required: false
        default: ""
        type: string
      upload:
        description: "Загрузить ассеты в релиз тега (иначе сухой прогон)"
        required: false
        default: false
        type: boolean

# Права — на уровне job, по минимуму; по умолчанию нет никаких.
permissions: {}

# Отменять устаревший прогон можно только на PR: на main отмена посреди
# release-please оставила бы релиз недоделанным.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tag || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # git describe — версия в бинаре
          persist-credentials: false

      # Секреты в дереве — тот же gitleaks и тот же .gitleaks.toml, что на
      # pre-commit; образ закреплён по версии.
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner -v

      # Сами workflow — actionlint с закреплённым образом (тот же, что локально).
      - name: Actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build linux/amd64 and linux/arm64
        run: make build-all

      - name: Smoke
        run: |
          file dist/cream-linux-amd64 dist/cream-linux-arm64
          file dist/cream-linux-amd64 | grep -q 'statically linked'
          dist/cream-linux-amd64 version

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: govulncheck
        run: make vuln

  repro:
    name: Reproducible release build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # git describe — версия пакетов
          persist-credentials: false

      # Две сборки dist-release с одним SOURCE_DATE_EPOCH и разными кешами Go —
      # SHA256SUMS совпадают байт в байт (спека §15).
      - name: repro-check
        run: make repro-check

  # Сценарий §14 в контейнере с systemd как PID 1 (цель test-integration —
  # задача 19 плана; пакет под архитектуру раннера собирает сама цель через deb).
  integration:
    name: Integration ${{ matrix.distro }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            arch: amd64
            runner: ubuntu-latest
          - distro: ubuntu-24.04
            arch: amd64
            runner: ubuntu-latest
          - distro: debian-13
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # git describe — версия пакета
          persist-credentials: false

      - name: make test-integration
        run: make test-integration DISTRO="${{ matrix.distro }}" ARCH="${{ matrix.arch }}"

      # Лог прогона (.scratchpad/test-runs/integration-<distro>-<время>/) —
      # для разбора упавшего сценария.
      - name: Upload integration log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ matrix.distro }}-${{ matrix.arch }}
          path: .scratchpad/test-runs/
          if-no-files-found: ignore
          retention-days: 7

  release-please:
    name: Release Please
    needs: [check, vuln, repro, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: .github/release_please/release-please-config.json
          manifest-file: .github/release_please/.release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # Ассеты релиза: после release-please, создавшего релиз, или вручную по tag.
  # На ручном запуске release-please пропущен — !cancelled() не даёт пропуску
  # снять и этот job.
  release-assets:
    name: Release assets
    needs: release-please
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Один тег — одна сборка за раз; начатую загрузку не отменять.
    concurrency:
      group: release-assets-${{ needs.release-please.outputs.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      UPLOAD: ${{ needs.release-please.outputs.release_created == 'true' || inputs.upload }}
    steps:
      - name: Check tag
        run: |
          printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "release-assets: тег должен быть vX.Y.Z, получено: $TAG" >&2
            exit 1
          }

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0   # git describe и время коммита тега
          persist-credentials: false

      # VERSION — тег (DEB_VERSION = без «v»), SOURCE_DATE_EPOCH — время коммита
      # тега: те же байты, что у make dist-release / repro-check локально.
      - name: make dist-release
        run: |
          epoch="$(git log -1 --format=%ct "refs/tags/$TAG^{commit}")"
          make dist-release VERSION="$TAG" SOURCE_DATE_EPOCH="$epoch"
          ls -l dist/release
          cat dist/release/SHA256SUMS

      - name: Verify assets
        working-directory: dist/release
        run: |
          v="${TAG#v}"
          for f in "cream_${v}_amd64.deb" "cream_${v}_arm64.deb" \
            "cream_${v}_linux_amd64.tar.gz" "cream_${v}_linux_arm64.tar.gz"; do
            [ -s "$f" ] || { echo "release-assets: нет $f" >&2; exit 1; }
            grep -q "  $f\$" SHA256SUMS || { echo "release-assets: $f нет в SHA256SUMS" >&2; exit 1; }
          done
          [ "$(wc -l <SHA256SUMS)" -eq 4 ] || { echo "release-assets: в SHA256SUMS не 4 строки" >&2; exit 1; }
          sha256sum -c SHA256SUMS
          {
            echo "### Ассеты $TAG"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload to GitHub Release
        if: env.UPLOAD == 'true'
        working-directory: dist/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${TAG#v}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "cream_${v}_amd64.deb" "cream_${v}_arm64.deb" \
            "cream_${v}_linux_amd64.tar.gz" "cream_${v}_linux_arm64.tar.gz" \
            SHA256SUMS

  # Выпуск поднимает пин cream у потребителей: в каждом целевом репозитории
  # запускает свой workflow, который берёт SHA256SUMS выпуска, ставит версию
  # и суммы .deb и открывает PR (идемпотентно: пин уже на версии или PR
  # открыт — второго нет). Идёт после release-assets: до загрузки сумм нет.
  #
  #   cream-extensions  cream-bump.yml        tools/cream-pin.env
  #   bisquite          cream-bump.yml        cream-pin.env и фикстуры контракта
  #   stvor             robot-pins-bump.yml   CREAM_* в .env.example
  #
  # У каждой цели свой выключатель (переменная репозитория = true) и свой
  # токен: fine-grained PAT только на целевой репозиторий с правом Actions:
  # Read and write (ветку и PR там делает GITHUB_TOKEN того workflow). Нет
  # секрета — предупреждение в журнале, job зелёный: выпуск cream от
  # потребителей не зависит. GITHUB_TOKEN чужой workflow запустить не может.
  dispatch:
    name: Bump cream in ${{ matrix.repo }}
    needs: [release-please, release-assets]
    if: >-
      !cancelled() && needs.release-assets.result == 'success' && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.upload)
      )
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: cream-extensions
            workflow: cream-bump.yml
            switch: EXTENSIONS_BUMP_ENABLED
            secret: EXTENSIONS_DISPATCH_TOKEN
          - repo: bisquite
            workflow: cream-bump.yml
            switch: BISQUITE_BUMP_ENABLED
            secret: BISQUITE_DISPATCH_TOKEN
          - repo: stvor
            workflow: robot-pins-bump.yml
            switch: STVOR_BUMP_ENABLED
            secret: STVOR_DISPATCH_TOKEN
            args: -f component=cream
    steps:
      - name: Dispatch ${{ matrix.workflow }}
        env:
          GH_TOKEN: ${{ secrets[matrix.secret] }}
          ENABLED: ${{ vars[matrix.switch] }}
          SWITCH: ${{ matrix.switch }}
          SECRET: ${{ matrix.secret }}
          WORKFLOW: ${{ matrix.workflow }}
          ARGS: ${{ matrix.args }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          TARGET_REPO: iamletenkov/${{ matrix.repo }}
        run: |
          set -euo pipefail
          if [ "$ENABLED" != true ]; then
            echo "::notice::$SWITCH не true — подъём cream $TAG в $TARGET_REPO пропущен"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег выпуска должен иметь вид vX.Y.Z, получено: '$TAG'"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Нет секрета $SECRET — подъём cream $TAG в $TARGET_REPO пропущен"
            exit 0
          fi
          # ARGS — из матрицы выше, не из ввода; разбиение по словам намеренно.
          # shellcheck disable=SC2086
          gh workflow run "$WORKFLOW" -R "$TARGET_REPO" --ref main $ARGS -f tag="$TAG"
          echo "Запущен $WORKFLOW в $TARGET_REPO для $TAG"
