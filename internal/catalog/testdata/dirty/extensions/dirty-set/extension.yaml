schema: cream/v1
name: dirty-set
version: 1.0.0
summary: грязная фикстура — cream set в действии lock none
cream: ">=1.0.0"
platform: {family: deb, arch: [amd64, arm64]}
# Валидатор предупреждает только про write: read не пишет домен,
# exclusive-write держит блокировку.
hooks:
  install: {}
actions:
  read: {summary: "только читает домен", lock: none}
  write: {summary: "пишет домен без блокировки — нарушение §6.3", lock: none}
  exclusive-write: {summary: "пишет домен под блокировкой"}
